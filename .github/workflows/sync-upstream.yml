name: Sync Fork with Upstream

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Synchronize from upstream
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error title=Missing UPSTREAM_SYNC_TOKEN::Add a repository secret backed by a token with Contents and Workflows write permissions."
            exit 1
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=main